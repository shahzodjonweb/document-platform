name: pdfmaster-platform
x-platform: &platform
  image: ${PDFMASTER_IMAGE:?Missing platform image}
  env_file: ${PDFMASTER_ENV_FILE:?Set absolute environment file}
  environment: &platform-env
    DEBUG: "0"
    DEVELOPMENT_LOGIN_ENABLED: "0"
    LOCAL_SYNC_JOBS: "0"
    COMMERCE_SANDBOX_ENABLED: "0"
    DATABASE_URL: postgresql://pdfmaster:${POSTGRES_PASSWORD:?Set database password}@db:5432/pdfmaster
    PRIVATE_STORAGE_ROOT: /data/private
    STATIC_ROOT: /data/static
    REDIS_URL: redis://redis:6379/0
    TRUST_PROXY_HEADERS: "1"
  volumes:
    - private-files:/data/private
    - static-files:/data/static
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp:size=512m, /run:size=8m]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  stop_grace_period: 120s
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
  logging: &logging
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: pdfmaster
      POSTGRES_DB: pdfmaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
    volumes: [database:/var/lib/postgresql/data]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pdfmaster -d pdfmaster]
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging
  redis:
    image: redis:8-alpine@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d
    command: [redis-server, --appendonly, "yes", --maxmemory, 128mb, --maxmemory-policy, noeviction]
    volumes: [redis:/data]
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.25
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging
  init:
    <<: *platform
    profiles: [maintenance]
    restart: "no"
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py collectstatic --noinput"]
    mem_limit: 512m
    cpus: 1
  api:
    <<: *platform
    mem_limit: 1536m
    cpus: 1.5
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 20s
  worker:
    <<: *platform
    command: [python, manage.py, runworker]
    mem_limit: 2g
    cpus: 1.5
    # On SIGTERM the loop finishes the job in hand before exiting
    # (apps/core/shutdown.py). Ten minutes covers a 10-slide deck and stays
    # inside the deploy's 900 s per-command limit with `--wait-timeout 180`.
    stop_grace_period: 600s
  batches:
    <<: *platform
    command: [python, manage.py, runbatches]
    mem_limit: 384m
    cpus: 0.5
    stop_grace_period: 600s
  cleanup:
    <<: *platform
    command: [python, scripts/cleanup_loop.py]
    # Telegram challenge housekeeping loads the Telegram SDK in this daemon.
    mem_limit: 384m
    cpus: 0.25
  bot:
    <<: *platform
    profiles: [bot]
    command: [python, manage.py, runbot, --wait-for-config]
    mem_limit: 384m
    cpus: 0.5
  gateway:
    image: nginxinc/nginx-unprivileged:stable-alpine@sha256:4714e0b1b2577eaa1a6131d07c958b67f0eb68e6d0521e90c6e5287db8cf0bc5
    ports: ["127.0.0.1:${PDFMASTER_HTTP_PORT:-8311}:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static-files:/srv/static:ro
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api: {condition: service_healthy}
    logging: *logging
volumes:
  database:
  private-files:
  static-files:
  redis:
