# Example only: merge a NEW virtual host into the existing server's proxy.
# Do not replace the existing project's nginx configuration.
server {
    listen 80;
    server_name pdfmaster-admin.orderdesk.live;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name pdfmaster-admin.orderdesk.live;
    ssl_certificate /etc/letsencrypt/live/pdfmaster-admin.orderdesk.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdfmaster-admin.orderdesk.live/privkey.pem;
    client_max_body_size 220m;
    location / {
        proxy_pass http://127.0.0.1:8311;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
}
