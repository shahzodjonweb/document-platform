# The host TLS proxy must overwrite X-Forwarded-Proto. This gateway binds only
# loopback; databases, application containers and Redis have no host ports.
map $http_x_forwarded_proto $pdfmaster_scheme {
    default http;
    https https;
}
server {
    listen 8080;
    server_name _;
    client_max_body_size 220m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $pdfmaster_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location /static/ {
        alias /srv/static/;
        add_header X-Content-Type-Options nosniff always;
        expires 1h;
    }
    location ~ ^/(api|ops|django-admin)(/|$) {
        proxy_pass http://api:8000;
    }
    location / {
        proxy_pass http://web:3000;
    }
}
