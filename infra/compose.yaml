# Local integration stack. Docker is not installed on the implementation host;
# this definition must pass the documented deployment gate before production use.
x-platform: &platform
  build:
    context: ..
    dockerfile: infra/Dockerfile
  env_file: ../.env
  environment: &environment
    DEBUG: "1"
    DEVELOPMENT_LOGIN_ENABLED: "1"
    ENABLE_BETA_TOOLS: "1"
    LOCAL_SYNC_JOBS: "0"
    DATABASE_URL: postgresql://pdfmaster:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/pdfmaster
    PRIVATE_STORAGE_ROOT: /data/private
    REDIS_URL: redis://redis:6379/0
  volumes:
    - private-files:/data/private
  depends_on:
    db:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
services:
  db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: pdfmaster
      POSTGRES_DB: pdfmaster
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [database:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U pdfmaster -d pdfmaster']
      interval: 5s
      retries: 20
  redis:
    image: redis:8-alpine@sha256:ba6e394f6acc2a695ef1b6944f161b9ca813711739be68319fa0db3470673f1d
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis:/data]
  migrate:
    <<: *platform
    command: [python, manage.py, migrate, --noinput]
  api:
    <<: *platform
    # Development serving includes staff static assets; deployed WSGI requires a
    # separately configured static origin/reverse proxy and collectstatic.
    command: [python, manage.py, runserver, '0.0.0.0:8000', --noreload]
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    <<: *platform
    command: [python, manage.py, runworker]
    depends_on:
      migrate:
        condition: service_completed_successfully
  cleanup:
    <<: *platform
    command: [python, scripts/cleanup_loop.py]
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: ../../document-web
      args:
        API_ORIGIN: http://api:8000
    ports: ['127.0.0.1:3000:3000']
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: '3000'
    depends_on: [api]
volumes:
  database:
  private-files:
  redis:
