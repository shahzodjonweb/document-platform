[project]
name = "pdfmaster-platform"
version = "0.1.0"
description = "Private document processing, Telegram identity and staff operations"
requires-python = ">=3.12,<3.14"
dependencies = ["google-auth==2.58.0", "Django==5.2.17", "djangorestframework==3.18.1", "drf-spectacular==0.30.0", "pypdf[crypto]==6.19.0", "Pillow==12.3.0", "numpy==2.2.6", "opencv-python-headless==4.13.0.92", "pypdfium2==5.13.0", "reportlab==5.0.1", "aiogram==3.31.0", "celery==5.6.3", "psycopg[binary]==3.3.6", "dj-database-url==3.1.2", "gunicorn==26.2.0", "pdfplumber==0.11.10", "python-docx==1.2.0", "openpyxl==3.1.5", "python-pptx==1.0.2", "boto3==1.43.108"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
[tool.ruff]
line-length = 120
