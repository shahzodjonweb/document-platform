[project]
name = "pdfmaster-platform"
version = "0.1.0"
description = "Private document processing, Telegram identity and staff operations"
requires-python = ">=3.12,<3.14"
dependencies = ["Django==5.2.17", "djangorestframework==3.18.1", "drf-spectacular==0.30.0", "pypdf[crypto]==6.19.0", "Pillow==12.3.0", "pypdfium2==5.13.0", "reportlab==5.0.1", "aiogram==3.31.0", "celery==5.6.3", "psycopg[binary]==3.3.6", "dj-database-url==3.1.2", "gunicorn==26.2.0"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
[tool.ruff]
line-length = 120
