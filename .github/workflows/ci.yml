name: Platform CI and deployment
on:
  push:
    branches: [main]
    paths-ignore: ["scripts/operations/**", ".github/workflows/server-operations.yml", ".github/workflows/server-operation-job.yml", "docs/**", "**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:
    inputs:
      suite:
        description: "Tests to run: core (the main cases, as on every push) or full (every test, on both databases, split over 16 runners)"
        type: choice
        options: [core, full]
        default: core
permissions:
  contents: read
concurrency:
  # A newer push to a pull request replaces its older run. Runs on main are
  # never cancelled: one may be in the middle of a deploy.
  group: platform-ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: ${{ format('verify ({0}{1}, {2})', matrix.tier, matrix.shard && format(' {0}', matrix.shard) || '', matrix.database) }}
    runs-on: ubuntu-latest
    # Every push runs the main cases (tests/core_tests.txt, PYTEST_TIER=core) on
    # Postgres, as production runs: about a minute of tests instead of the
    # whole suite's 16 (SQLite) and 24 (Postgres). The full suite is one click
    # away (Run workflow -> full), split over 16 runners (scripts/shards.py).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.suite == 'full' && '[{"database":"sqlite","shard":"1/8","tier":"full","once":true},{"database":"sqlite","shard":"2/8","tier":"full","once":false},{"database":"sqlite","shard":"3/8","tier":"full","once":false},{"database":"sqlite","shard":"4/8","tier":"full","once":false},{"database":"sqlite","shard":"5/8","tier":"full","once":false},{"database":"sqlite","shard":"6/8","tier":"full","once":false},{"database":"sqlite","shard":"7/8","tier":"full","once":false},{"database":"sqlite","shard":"8/8","tier":"full","once":false},{"database":"postgres","shard":"1/8","tier":"full","once":false},{"database":"postgres","shard":"2/8","tier":"full","once":false},{"database":"postgres","shard":"3/8","tier":"full","once":false},{"database":"postgres","shard":"4/8","tier":"full","once":false},{"database":"postgres","shard":"5/8","tier":"full","once":false},{"database":"postgres","shard":"6/8","tier":"full","once":false},{"database":"postgres","shard":"7/8","tier":"full","once":false},{"database":"postgres","shard":"8/8","tier":"full","once":false}]' || '[{"database":"postgres","shard":"","tier":"core","once":true}]') }}
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: pdfmaster
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: pdfmaster
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pdfmaster -d pdfmaster"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DEBUG: "1"
      DEVELOPMENT_LOGIN_ENABLED: "1"
      ENABLE_BETA_TOOLS: "1"
      LOCAL_SYNC_JOBS: "1"
      PYTEST_TIER: ${{ matrix.tier }}
      PYTEST_SHARD: ${{ matrix.shard }}
      PPTX_TEST_SOFFICE: "/usr/bin/soffice"
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://pdfmaster:ci-test-password@127.0.0.1:5432/pdfmaster' || 'sqlite:////tmp/pdfmaster-ci.sqlite3' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      # The packages (~90 MB) come from the Actions cache, not Ubuntu's mirror,
      # which has stalled installs for many minutes.
      - name: Restore cached system packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: apt-noble-runtimes-
          restore-keys: apt-noble-runtimes-
      - name: Install document processing runtimes
        id: runtimes
        timeout-minutes: 12
        run: |
          mkdir -p ~/apt-archives/partial
          apt="-o Dir::Cache::Archives=$HOME/apt-archives -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
          for attempt in 1 2 3; do
            sudo apt-get update $apt && break
            echo "apt-get update attempt $attempt failed; retrying"; sleep 5
          done
          for attempt in 1 2 3; do
            # A slow mirror never stalls long enough for apt's own timeout: cap
            # each attempt, and retry from Ubuntu's main archive. apt resumes
            # the partly downloaded packages rather than starting again.
            timeout 180 sudo apt-get install -y --no-install-recommends $apt \
              tesseract-ocr libreoffice-writer libreoffice-impress fonts-dejavu-core && break
            echo "apt-get install attempt $attempt failed; retrying from archive.ubuntu.com"
            [ "$attempt" = 3 ] && exit 1
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              { echo "http://archive.ubuntu.com/ubuntu/"; cat /etc/apt/apt-mirrors.txt; } > /tmp/apt-mirrors.txt
              sudo cp /tmp/apt-mirrors.txt /etc/apt/apt-mirrors.txt
            fi
            sudo apt-get update $apt || true
          done
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
          # The cache is keyed by the exact package versions installed, so a
          # new LibreOffice or Tesseract release is cached once and reused.
          echo "key=apt-noble-runtimes-$(ls ~/apt-archives | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache system packages
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        # The first runner to save a set of versions stores it; the rest find it taken.
        continue-on-error: true
        with:
          path: ~/apt-archives
          key: ${{ steps.runtimes.outputs.key }}
      - run: pip install -r requirements.lock
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Run tests
        run: |
          # Core collects only the files it names; full collects everything.
          if [ "$PYTEST_TIER" = core ]; then
            paths=$(grep "::" tests/core_tests.txt | cut -d: -f1 | sort -u)
          else
            paths="tests apps/commerce/tests"
          fi
          python -m pytest $paths -q
      # Checks that depend on neither the database nor the shard run once.
      - if: matrix.once
        run: python -m unittest discover -s scripts/deploy/tests -v
      - if: matrix.once
        run: python scripts/coverage_report.py --check
      - if: matrix.once
        run: python scripts/verify_contract.py
  package:
    # Builds and smoke-tests the image while the suite runs. Deploy still
    # needs both to pass.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_PLATFORM: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: env.DEPLOY_PLATFORM == 'linux/arm64'
      - name: Build immutable release image
        run: |
          case "$DEPLOY_PLATFORM" in linux/amd64|linux/arm64) ;; *) exit 1 ;; esac
          image="pdfmaster-platform:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --pull --platform "$DEPLOY_PLATFORM" -f infra/Dockerfile -t "$image" .
          python3 scripts/deploy/container_smoke.py platform "$image"
      - name: Package main release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/deploy/package.py platform
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: platform-release
          path: release.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  deploy:
    needs: [verify, package]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    with:
      component: platform
    # Deploy credentials come only from Secrets: the repository is public, and
    # Actions variables are not secret. Only the user name may be a variable.
    # The reusable workflow's secret inputs provide runner log masking only.
    secrets:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
