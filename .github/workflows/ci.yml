name: Platform CI and deployment
on:
  push:
    branches: [main]
    paths-ignore: ["scripts/operations/**", ".github/workflows/server-operations.yml", ".github/workflows/server-operation-job.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    # The whole suite took 16 minutes on SQLite and 24 on Postgres on one
    # 2-core runner. Each database's run is split over eight runners
    # (conftest.py, PYTEST_SHARD), balanced by measured file times; every test
    # still runs, once per database.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: pdfmaster
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: pdfmaster
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pdfmaster -d pdfmaster"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DEBUG: "1"
      DEVELOPMENT_LOGIN_ENABLED: "1"
      ENABLE_BETA_TOOLS: "1"
      LOCAL_SYNC_JOBS: "1"
      PYTEST_SHARD: ${{ matrix.shard }}/8
      PPTX_TEST_SOFFICE: "/usr/bin/soffice"
      DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql://pdfmaster:ci-test-password@127.0.0.1:5432/pdfmaster' || 'sqlite:////tmp/pdfmaster-ci.sqlite3' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install document processing runtimes
        # A stalled Ubuntu mirror once held a shard in apt-get update for 19
        # minutes. Stalls now time out in seconds and are retried.
        timeout-minutes: 8
        run: |
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            timeout 120 sudo apt-get update $apt && break
            echo "apt-get update attempt $attempt failed; retrying"
          done
          for attempt in 1 2 3; do
            timeout 240 sudo apt-get install -y --no-install-recommends $apt \
              tesseract-ocr libreoffice-writer libreoffice-impress fonts-dejavu-core && break
            echo "apt-get install attempt $attempt failed; retrying"
            [ "$attempt" = 3 ] && exit 1
          done
      - run: pip install -r requirements.lock
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest tests apps/commerce/tests -q
      # Checks that depend on neither the database nor the shard run once.
      - if: matrix.shard == 1 && matrix.database == 'sqlite'
        run: python -m unittest discover -s scripts/deploy/tests -v
      - if: matrix.shard == 1 && matrix.database == 'sqlite'
        run: python scripts/coverage_report.py --check
      - if: matrix.shard == 1 && matrix.database == 'sqlite'
        run: python scripts/verify_contract.py
  package:
    # Builds and smoke-tests the image while the suite runs. Deploy still
    # needs both to pass.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_PLATFORM: ${{ vars.DEPLOY_PLATFORM || 'linux/amd64' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        if: env.DEPLOY_PLATFORM == 'linux/arm64'
      - name: Build immutable release image
        run: |
          case "$DEPLOY_PLATFORM" in linux/amd64|linux/arm64) ;; *) exit 1 ;; esac
          image="pdfmaster-platform:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker build --pull --platform "$DEPLOY_PLATFORM" -f infra/Dockerfile -t "$image" .
          python3 scripts/deploy/container_smoke.py platform "$image"
      - name: Package main release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python3 scripts/deploy/package.py platform
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: platform-release
          path: release.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  deploy:
    needs: [verify, package]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    with:
      component: platform
    # Accept Actions Variables and Secrets; keep an existing SSH key in Secrets.
    # The reusable workflow's secret inputs provide runner log masking only.
    secrets:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY || vars.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS || secrets.DEPLOY_KNOWN_HOSTS }}
