<form class="filterbar" method="get"><input type="hidden" name="lang" value="{{ lang }}"><label>{{ t.date_from }}<input name="date_from" type="date" value="{{ filters.date_from }}" required></label><label>{{ t.date_to }}<input name="date_to" type="date" value="{{ filters.date_to }}" required></label><label>{{ t.timezone }}<select name="timezone">{% if filters.timezone != 'UTC' and filters.timezone != 'Asia/Tashkent' and filters.timezone != 'Europe/Moscow' %}<option selected>{{ filters.timezone }}</option>{% endif %}<option {% if filters.timezone == 'UTC' %}selected{% endif %}>UTC</option><option {% if filters.timezone == 'Asia/Tashkent' %}selected{% endif %}>Asia/Tashkent</option><option {% if filters.timezone == 'Europe/Moscow' %}selected{% endif %}>Europe/Moscow</option></select></label><label>{{ t.channel }}<select name="channel"><option value="">{{ t.all }}</option><option value="web" {% if filters.channel == 'web' %}selected{% endif %}>Web</option><option value="bot" {% if filters.channel == 'bot' %}selected{% endif %}>Telegram Bot</option><option value="mini_app" {% if filters.channel == 'mini_app' %}selected{% endif %}>Mini App</option></select></label><label>{{ t.locale }}<select name="locale"><option value="">{{ t.all }}</option><option value="en" {% if filters.locale == 'en' %}selected{% endif %}>English</option><option value="uz" {% if filters.locale == 'uz' %}selected{% endif %}>O‘zbekcha</option><option value="ru" {% if filters.locale == 'ru' %}selected{% endif %}>Русский</option></select></label><label>{{ t.environment }}<select name="environment"><option value="production" {% if filters.environment == 'production' %}selected{% endif %}>{{ t.production }}</option><option value="development" {% if filters.environment == 'development' %}selected{% endif %}>{{ t.development }}</option></select></label><button class="button secondary">{{ t.apply }}</button></form>
{% if filters.environment == 'development' %}<p class="environment-note"><span class="status-dot"></span>{{ t.notice_test }}</p>{% endif %}
